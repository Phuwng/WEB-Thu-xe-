<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thuê Xe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">CAR-RENTAL</div>
        <nav id="nav-menu">
            <a href="index.html">Trang chủ</a>
            <a href="#car-list">Ô tô</a>
            <a href="#bike-list">Mô tô</a>
            <span id="user-area">
                <a href="register.html">Đăng ký</a>
                <a href="login.html" style="background: #3498db; padding: 5px 10px; border-radius: 4px;">Đăng nhập</a>
            </span>
        </nav>
    </header>

    <div class="slider">
        <img id="slide" src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=1600&h=400&fit=crop" alt="Car Rental">
        <div id="loading" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 10px;">Đang tải...</div>
    </div>

    <div class="search-panel" style="max-width:900px; margin:20px auto; display:grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto auto; gap:10px; align-items:center;">
        <input id="search-input" placeholder="Tìm theo tên xe, chủ xe, mô tả..." style="padding:12px; border:1px solid #ddd; border-radius:6px; min-width:240px;">
        <input id="search-brand" placeholder="Hãng xe" style="padding:12px; border:1px solid #ddd; border-radius:6px; min-width:180px;">
        <select id="search-type" style="padding:12px; border:1px solid #ddd; border-radius:6px;">
            <option value="all">Tất cả loại xe</option>
            <option value="car">Ô tô</option>
            <option value="motorbike">Mô tô</option>
            <option value="electric">Xe điện</option>
        </select>
        <select id="search-status" style="padding:12px; border:1px solid #ddd; border-radius:6px;">
            <option value="all">Tất cả trạng thái</option>
            <option value="available">Sẵn sàng</option>
            <option value="unavailable">Đã thuê</option>
        </select>
        <button onclick="applySearch()" style="padding:12px 20px; background:#3498db; color:white; border:none; border-radius:6px; cursor:pointer;">Tìm kiếm</button>
        <button onclick="resetSearch()" style="padding:12px 20px; background:#95a5a6; color:white; border:none; border-radius:6px; cursor:pointer;">Xóa</button>
    </div>

    <h2>Danh sách Ô tô</h2>
    <div id="car-list" class="products"></div>

    <h2>Danh sách Mô tô</h2>
    <div id="bike-list" class="products"></div>

    <footer><p>© 2026 Hệ thống cho thuê xe.</p></footer>

    <div id="upload-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; overflow-y:auto;">
        <div style="background:white; width:500px; margin:40px auto; padding:25px; border-radius:8px;">
            <h3>Đăng tin cho thuê xe</h3><hr><br>
            <input id="up-name" placeholder="Tên xe (VD: Honda Vision)" style="width:100%; padding:10px; margin-bottom:10px;">
            <input id="up-price" type="number" placeholder="Giá thuê (VD: 150000)" style="width:100%; padding:10px; margin-bottom:10px;">
            
            <input id="up-owner" placeholder="Tên chủ xe" style="width:48%; padding:10px; margin-bottom:10px;">
            <input id="up-brand" placeholder="Hãng sản xuất" style="width:48%; padding:10px; margin-bottom:10px; float:right;">
            <input id="up-odo" type="number" placeholder="Số KM đã đi" style="width:100%; padding:10px; margin-bottom:10px;">
            <textarea id="up-desc" placeholder="Mô tả tình trạng xe..." style="width:100%; padding:10px; margin-bottom:10px;"></textarea>

            <label>Ảnh sản phẩm:</label>
            <input type="text" id="up-image-url" placeholder="Dán link ảnh..." style="width:100%; padding:10px; margin-bottom:5px;">
            <p style="text-align:center; margin: 5px 0;">HOẶC</p>
            <input type="file" id="up-image-file" accept="image/*" style="margin-bottom:10px;">
            
            <select id="up-type" style="width:100%; padding:10px; margin-bottom:15px;">
                <option value="car">Ô tô</option>
                <option value="motorbike">Mô tô</option>
            </select>
            <button onclick="submitVehicle()" style="width:100%; padding:10px; background:#2ecc71; color:white; border:none; cursor:pointer;">Gửi yêu cầu duyệt</button>
            <button onclick="closeModal('upload-modal')" style="width:100%; padding:10px; background:#95a5a6; color:white; border:none; margin-top:5px; cursor:pointer;">Hủy</button>
        </div>
    </div>

    <div id="detail-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; overflow-y:auto;">
        <div style="background:white; max-width:600px; margin:40px auto; padding:25px; border-radius:10px; position:relative;">
            <span onclick="closeModal('detail-modal')" style="position:absolute; right:20px; top:15px; cursor:pointer; font-size:28px;">&times;</span>
            <img id="dt-img" src="" style="width:100%; height:300px; object-fit:cover; border-radius:8px;">
            <h2 id="dt-name" style="margin-top:10px; text-align: left;"></h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; background:#f4f4f4; padding:15px; border-radius:5px; margin:15px 0;">
                <p><strong>Chủ xe:</strong> <span id="dt-owner"></span></p>
                <p><strong>Số KM:</strong> <span id="dt-odo"></span> km</p>
                <p><strong>Hãng:</strong> <span id="dt-brand"></span></p>
                <p><strong>Giá:</strong> <span id="dt-price" style="color:red; font-weight:bold;"></span>đ/ngày</p>
            </div>
            <p><strong>Mô tả:</strong> <span id="dt-desc"></span></p>
            <hr style="margin: 15px 0;">
            <div>
                <label style="font-weight:bold;">Số ngày thuê:</label>
                <input type="number" id="dt-days" value="1" min="1" oninput="updateTotalPreview()" style="width:80px; padding:8px; margin-left: 10px;">
                <p style="margin-top: 10px; font-size: 18px;">Tổng tiền: <strong id="dt-total" style="color:#27ae60;">0</strong> VNĐ</p>
                <button id="dt-btn-book" onclick="" class="btn-book" style="font-size: 18px; padding: 15px;"></button>
            </div>
        </div>
    </div>

    <div id="cart-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000;">
        <div style="background:white; max-width:700px; margin:50px auto; padding:25px; border-radius:8px; position:relative;">
            <span onclick="closeModal('cart-modal')" style="position:absolute; right:20px; top:15px; cursor:pointer; font-size:28px;">&times;</span>
            <h2>Giỏ hàng / Lịch hẹn</h2>
            <div id="cart-container" style="max-height: 400px; overflow-y: auto; margin-top:20px;"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
